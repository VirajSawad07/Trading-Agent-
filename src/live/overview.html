<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Bots</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --border: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
  --buy: #2a78d6; --sell: #e34948; --good: #0ca30c; --good-text: #006300; --warning: #fab219;
  --warn-text: #8a5a00; --critical: #d03b3b; --accent-wash: rgba(42,120,214,0.10); --bad-wash: rgba(208,59,59,0.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --buy: #3987e5; --sell: #e66767; --good-text: #0ca30c; --warn-text: #fab219;
    --accent-wash: rgba(57,135,229,0.16); --bad-wash: rgba(230,103,103,0.16);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --buy: #3987e5; --sell: #e66767; --good-text: #0ca30c; --warn-text: #fab219;
  --accent-wash: rgba(57,135,229,0.16); --bad-wash: rgba(230,103,103,0.16);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 22px 16px 48px; }
header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 18px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); font-size: 13px; color: var(--ink-2); }
.spacer { flex: 1; }
.meta { color: var(--muted); font-size: 12px; }
.label { color: var(--ink-2); font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--grid);
  border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 8px; }
.stat { background: var(--surface); padding: 12px 14px; }
.stat .v { font-size: 22px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .s { color: var(--muted); font-size: 12px; }
.botline { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 22px; font-size: 13px; color: var(--ink-2); }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--grid); margin-bottom: 16px; scrollbar-width: thin; }
.tab { font: inherit; font-size: 13px; padding: 8px 12px; border: 0; background: none; color: var(--ink-2); cursor: pointer;
  border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.tab:focus-visible { outline: 2px solid var(--buy); outline-offset: -2px; }
.tab .chg { font-size: 11px; font-variant-numeric: tabular-nums; }
.mhead { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin-bottom: 12px; }
.mhead .price { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.state { margin-bottom: 14px; padding: 10px 12px; border-radius: 8px; background: var(--wash); }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border);
  color: var(--ink-2); white-space: nowrap; }
.tag.BUY { color: var(--buy); border-color: var(--buy); background: var(--accent-wash); }
.tag.SELL, .tag.BLOCKED { color: var(--sell); border-color: var(--sell); background: var(--bad-wash); }
.tag.CLOSE { color: var(--ink); border-color: var(--ink-2); }
.tag.HOLD { color: var(--good-text); border-color: var(--good); }
.tag.SKIP { color: var(--warn-text); border-color: var(--warning); }
h2 { font-size: 13px; margin: 20px 0 8px; font-weight: 600; color: var(--ink-2); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.t { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.det { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.feed { max-height: 460px; overflow: auto; }
.pos { color: var(--good-text); } .neg { color: var(--critical); }
.empty { color: var(--muted); padding: 20px 0; text-align: center; }
details { margin-top: 26px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
.log { margin: 10px 0 0; max-height: 380px; overflow: auto; background: var(--wash); border-radius: 8px; padding: 10px 12px;
  font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
.log .err { color: var(--critical); } .log .warn { color: var(--warn-text); }
.note { color: var(--muted); font-size: 12px; margin-top: 18px; }
.hours { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Trading bots</h1>
    <span class="pill" id="acct">MT5 …</span>
    <span class="spacer"></span>
    <span class="meta" id="updated"></span>
  </header>

  <div class="label" style="margin-bottom:6px">Your account</div>
  <section class="stats" id="profile"></section>
  <div class="botline" id="botline"></div>

  <nav class="tabs" role="tablist" id="tabs" aria-label="Markets"></nav>
  <section id="panel" role="tabpanel"></section>

  <details>
    <summary>Bot logs</summary>
    <div style="margin-top:8px" id="logpick"></div>
    <pre class="log" id="logs" tabindex="0"></pre>
  </details>

  <p class="note">Read-only: this page cannot place, change or close trades. Refreshes every 10 seconds. R = the amount risked on a trade.</p>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = (x, d = 2) => x == null || isNaN(x) ? "–" : Number(x).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
const sgn = (x, d = 2) => x == null ? "–" : (x > 0 ? "+" : "") + fmt(x, d);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cls = x => x == null ? "" : x > 0 ? "pos" : x < 0 ? "neg" : "";
// All times are shown in this computer's own time zone (Nepal time here).
const toDate = s => new Date(/[zZ]|[+-]\d\d:\d\d$/.test(s) ? s : s.replace(" ", "T") + "Z");
const t16 = s => { if (!s) return "–"; const d = toDate(s);
  return esc(d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false })); };
const TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return "local"; } })();
function until(s) { const m = Math.round((toDate(s) - Date.now()) / 60000); if (m <= 0) return "any minute";
  return m < 60 ? `in ${m} min` : m < 48 * 60 ? `in ${Math.floor(m / 60)} h ${m % 60} min` : `in ${Math.round(m / 1440)} days`; }
function openState(q) {
  if (!q || q.open == null) return { kind: "warn", short: "–", text: "Market status unknown" };
  if (q.open) return { kind: "good", short: "Open", text: "Market open" };
  const why = q.reason === "weekend" ? "Closed for the weekend" : "Closed (session break)";
  const re = q.reopens_utc ? ` · usually reopens ${t16(q.reopens_utc)} (${until(q.reopens_utc)})` : "";
  return { kind: "bad", short: "Closed", text: `${why} · last price ${t16(q.last_tick_utc)}${re}` };
}
const pct = x => x == null ? "–" : Math.round(x * 100) + "%";
function dot(kind, text) {
  const c = { good: "--good", warn: "--warning", bad: "--critical" }[kind], i = { good: "●", warn: "▲", bad: "■" }[kind];
  return `<span style="color:var(${c})" aria-hidden="true">${i}</span>${esc(text)}`;
}
const BOT = { gold: "Gold bot", dips: "Index dips bot" };
let data = null, acct = null, logData = null, tab = "all", logSel = "gold";
try { tab = localStorage.getItem("tab") || "all"; } catch (e) {}

function details(d) {
  const x = d.details || {}, o = [];
  if (d.bot === "gold") {
    if (x.close != null) o.push(`close ${fmt(x.close)}`);
    if (x.channel_low != null) o.push(`range ${fmt(x.channel_low)}–${fmt(x.channel_high)}`);
    if (x.probability != null) o.push(`model ${Math.round(x.probability * 100)}% (needs ${Math.round((x.threshold || 0.5) * 100)}%)`);
    if (x.bars_held) o.push(`held ${x.bars_held} h`);
  } else {
    if (x.close != null) o.push(`close ${fmt(x.close, 1)}`);
    if (x.sma200 != null) o.push(`200-day ${fmt(x.sma200, 1)}`);
    if (x.rsi2 != null) o.push(`RSI(2) ${fmt(x.rsi2, 1)} (buys < 10)`);
    if (x.held_bars != null) o.push(`held ${x.held_bars} d`);
  }
  return o.join(" · ");
}

function statsFor(trades) {
  const closed = trades.filter(t => t.closed && t.r != null);
  const wins = closed.filter(t => t.r > 0).length, rsum = closed.reduce((a, t) => a + t.r, 0);
  const pnl = closed.reduce((a, t) => a + (t.pnl_usd || 0), 0), lots = trades.reduce((a, t) => a + (t.lots || 0), 0);
  return { n: closed.length, open: trades.length - closed.length, wins, losses: closed.length - wins,
    rate: closed.length ? wins / closed.length : null, r: rsum, avg: closed.length ? rsum / closed.length : null, pnl, lots };
}

function renderProfile() {
  const a = acct || {}, inc = a.income || {}, cur = a.currency || "";
  $("acct").innerHTML = a.mode ? (a.mode === "DEMO" ? dot("good", `Demo #${a.login}`) : dot("bad", `Real #${a.login} · ${a.server}`)) : dot("warn", "MT5 not connected");
  const cells = a.mode ? [
    ["Balance", `${fmt(a.balance)} ${esc(cur)}`, `equity ${fmt(a.equity)} · open ${sgn(a.equity - a.balance)}`],
    ["Realised P&L", `<span class="${cls(inc.realised)}">${sgn(inc.realised)} ${esc(cur)}</span>`, `${inc.closed_trades ?? 0} closed trades, all time`],
    ["Wins / losses", `${inc.wins ?? 0} / ${inc.losses ?? 0}`, `win rate ${pct(inc.win_rate)}`],
    ["Average win", `<span class="pos">${sgn(inc.avg_win)}</span>`, `average loss <span class="neg">${sgn(inc.avg_loss)}</span>`],
    ["Open positions", `${(a.positions || []).length}`, `loss if all stops hit ${fmt(a.open_risk)} ${esc(cur)}`],
  ] : [["Account", "–", "MT5 is not connected"]];
  $("profile").innerHTML = cells.map(([l, v, s]) => `<div class="stat"><div class="label">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");
  $("botline").innerHTML = Object.values(data.bots).map(b => {
    const mode = b.signals_only ? "signals only, no orders" : "demo trading";
    return `<span>${b.running ? dot("good", `${b.name}: running (${mode})`) : dot("warn", `${b.name}: ${b.stop_reason || "not running"}`)}</span>`;
  }).join("") + (data.signals_only ? `<span class="meta">Real account: the bots log decisions but place no trades.</span>` : "");
}

function renderTabs() {
  const q = acct?.quotes || {};
  const items = [["all", "All markets", null, null], ...data.markets.map(m => [m.market, m.market, q[m.market]?.change_pct, q[m.market]])];
  const odot = qq => { if (!qq || qq.open == null) return ""; const o = openState(qq);
    return `<span style="color:var(${o.kind === "good" ? "--good" : "--muted"})" title="${esc(o.text)}" aria-label="${o.short}">${o.kind === "good" ? "●" : "○"}</span>`; };
  $("tabs").innerHTML = items.map(([k, l, c, qq]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${tab === k}">${odot(qq)}${esc(l)}`
    + (c == null ? "" : `<span class="chg ${cls(c)}">${sgn(c)}%</span>`) + `</button>`).join("");
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; try { localStorage.setItem("tab", tab); } catch (e) {} renderTabs(); renderPanel(); });
}

function decisionTable(rows, showMarket) {
  return `<div class="feed tablewrap"><table><thead><tr><th>Time</th>${showMarket ? "<th>Market</th>" : ""}<th>Decision</th><th>Why</th></tr></thead><tbody>`
    + (rows.map(d => `<tr><td class="t">${t16(d.time)}</td>${showMarket ? `<td>${esc(d.market || "")}</td>` : ""}
      <td><span class="tag ${esc(d.action.replace(" ", "_"))}">${esc(d.action)}</span></td>
      <td>${esc(d.reason.replace(/^[A-Z0-9]+ \d{4}-\d{2}-\d{2}: /, ""))}<span class="det">${esc(details(d))}</span></td></tr>`).join("")
      || `<tr><td colspan="4" class="empty">No decisions yet.</td></tr>`) + `</tbody></table></div>`;
}

function statCells(s) {
  return [["Trades", `${s.n}`, s.open ? `${s.open} open` : "closed"], ["Wins / losses", `${s.wins} / ${s.losses}`, `win rate ${pct(s.rate)}`],
    ["Total R", `<span class="${cls(s.r)}">${sgn(s.r)}</span>`, `avg ${s.avg == null ? "–" : sgn(s.avg, 3)} R per trade`],
    ["Lots", fmt(s.lots), "summed over trades"]]
    .map(([l, v, x]) => `<div class="stat"><div class="label">${l}</div><div class="v">${v}</div><div class="s">${x}</div></div>`).join("");
}

function renderPanel() {
  const dec = data.decisions, tr = data.trades;
  if (tab === "all") {
    const qs = acct?.quotes || {}, rows = data.markets.map(m => ({ m, o: openState(qs[m.market]) }));
    const openN = rows.filter(r => r.o.kind === "good").length;
    $("panel").innerHTML = `<div class="state"><b>${openN} of ${rows.length} markets open</b>
      <div class="hours">${rows.map(r => `<span>${dot(r.o.kind === "good" ? "good" : "bad", r.m.market + ": " + r.o.short)}`
        + (r.o.kind === "good" ? "" : ` <span class="meta">${qs[r.m.market]?.reopens_utc ? "reopens " + t16(qs[r.m.market].reopens_utc) : ""}</span>`) + `</span>`).join("")}</div></div>
      <section class="stats">${statCells(statsFor(tr))}</section>
      <h2>Every decision, all markets</h2>${decisionTable(dec, true)}`;
    return;
  }
  const m = data.markets.find(x => x.market === tab), q = acct?.quotes?.[tab] || {};
  const mdec = dec.filter(d => d.market === tab), mtr = tr.filter(t => t.market === tab);
  const pos = (acct?.positions || []).find(p => p.market === q.broker);
  const paper = mtr.find(t => t.paper && !t.closed);
  const last = mdec[0];
  const state = pos ? `${dot("good", `Holding ${pos.side} ${pos.lots} lots`)} from ${fmt(pos.entry)} · stop ${fmt(pos.stop)} · open P&L <span class="${cls(pos.pnl)}">${sgn(pos.pnl)}</span>`
    : paper ? `${dot("good", "Paper position (signal only)")} bought at about ${fmt(paper.entry, 1)} · stop ${fmt(paper.stop, 1)}`
    : `Flat, waiting for a setup.`;
  $("panel").innerHTML = `<div class="mhead"><div><div class="label">${esc(m.name)} · ${esc(q.broker || tab)} · ${esc(BOT[m.bot])}</div>
      <span class="price">${fmt(q.bid)}</span> <span class="${cls(q.change_pct)}">${sgn(q.change_pct)}% today</span></div>
      </div>
    <div style="margin:-4px 0 12px">${dot(openState(q).kind, openState(q).text)}</div>
    <div class="state">${state}${last ? `<div style="margin-top:6px"><span class="tag ${esc(last.action.replace(" ", "_"))}">${esc(last.action)}</span>
      ${esc(last.reason.replace(/^[A-Z0-9]+ \d{4}-\d{2}-\d{2}: /, ""))} <span class="meta">${t16(last.time)}</span></div>` : ""}
      <div class="meta" style="margin-top:6px">${esc(m.bot === "gold" ? "Checks every hour while the market is open." : "Checks once a day, when the next trading day starts.")}</div></div>
    <section class="stats">${statCells(statsFor(mtr))}</section>
    <h2>Decisions on ${esc(tab)}</h2>${decisionTable(mdec, false)}`;
}

function renderLogs() {
  if (!logData) return;
  const opts = [["gold", "Gold bot"], ["dips", "Index dips bot"], ["start", "Start scripts"]];
  $("logpick").innerHTML = opts.map(([v, l]) => `<button class="tab" data-log="${v}" aria-selected="${logSel === v}">${l}</button>`).join("");
  document.querySelectorAll("[data-log]").forEach(b => b.onclick = () => { logSel = b.dataset.log; renderLogs(); });
  const lines = logSel === "start" ? [...logData.gold.autostart, ...logData.dips.autostart].sort() : logData[logSel].lines;
  const box = $("logs"), atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  box.innerHTML = lines.map(l => `<span class="${/ERROR|refused|Traceback/.test(l) ? "err" : /WARNING/.test(l) ? "warn" : ""}">${esc(l)}</span>`).join("\n") || "No log lines yet.";
  if (atEnd) box.scrollTop = box.scrollHeight;
}

async function tick() {
  try {
    const [o, a, l] = await Promise.all([fetch("/api/overview").then(r => r.json()),
      fetch("/api/account").then(r => r.json()).catch(() => ({ connected: false })),
      fetch("/api/logs").then(r => r.json()).catch(() => null)]);
    data = o; acct = a; logData = l;
    if (tab !== "all" && !data.markets.some(m => m.market === tab)) tab = "all";
    $("updated").textContent = `Updated ${new Date().toLocaleTimeString()} · times in ${TZ}`;
    renderProfile(); renderTabs(); renderPanel(); renderLogs();
  } catch (e) { $("updated").textContent = "Dashboard server not reachable"; }
}
tick(); setInterval(tick, 10000);
</script>
</body>
</html>
