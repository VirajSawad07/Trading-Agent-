# Track 2 cost assumptions (docs/RESEARCH_PLAN.md), written 2026-11-15 before any Track 2 result.
# spread = max(75th pct of the last 2 years' D1 spread column, live spread, config/symbols.yaml);
# slippage = 25% of spread (min 1 point), paid on every change of position.
# Financing: FX and metals use today's broker swap (points per lot per night, per calendar night);
# copper uses its broker interest rate; stock indexes pay a flat 2%/yr on longs and shorts
# (broker swaps imply about 1-1.5%/yr). Today's swaps are applied to all history: an approximation.
